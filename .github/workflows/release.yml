name: Build & Release

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Read VERSION
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

  mac:
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.version }}
    name: macOS (universal) - DMG with pkg installer
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --config Release --target CanopyPads_AU CanopyPads_VST3 CanopyPads_Standalone -j4 2>&1 | tee build.log || { grep -E "error" build.log | head -20 | sed 's/^/::error::/'; exit 1; }

      - name: Package (pkg + dmg)
        run: bash packaging/make-mac-installer.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*.dmg

  windows:
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.version }}
    name: Windows (x64) - Setup.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          cmake -B build -A x64 2>&1 | tee configure.log || { grep -iE "error|could not|not found" configure.log | head -20 | sed 's/^/::error::/'; exit 1; }

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --target CanopyPads_VST3 CanopyPads_Standalone 2>&1 | tee build.log || { grep -E "error" build.log | head -20 | sed 's/^/::error::/'; exit 1; }

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Package (Inno Setup)
        shell: pwsh
        run: |
          $v = "${env:VERSION}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\windows-installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  release:
    name: Publish GitHub Release
    needs: [version, mac, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Canopy Pads ${{ needs.version.outputs.version }}
          body_path: packaging/release-notes.md
          files: |
            dist/*.dmg
            dist/*.exe
